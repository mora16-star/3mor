  /* cursor ring */
  var ring=document.getElementById("ring"),rx=-100,ry=-100,tx=-100,ty=-100;
  addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;tx=e.clientX;ty=e.clientY;ring.classList.add("on");
    ring.classList.toggle("big",!!e.target.closest("a"))},{passive:true});
  document.addEventListener("pointerleave",function(){ring.classList.remove("on")});
  if(matchMedia("(pointer:fine)").matches)(function follow(){rx+=(tx-rx)*.18;ry+=(ty-ry)*.18;ring.style.transform="translate("+rx+"px,"+ry+"px)";requestAnimationFrame(follow)})();
  /* particle network */
  var c=document.getElementById("bg"),x=c.getContext("2d"),W,H,P=[],mouse={x:-999,y:-999},dpr=1;
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.min(matchMedia("(pointer:coarse)").matches?26:44,Math.floor(W*H/22000));P=[];
    for(var k=0;k<n;k++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35})}
  size();var lw=innerWidth;addEventListener("resize",function(){if(innerWidth!==lw){lw=innerWidth;size()}});
  addEventListener("pointermove",function(e){mouse.x=e.clientX;mouse.y=e.clientY},{passive:true});
  var stars=[];
  (function draw(){
    if(document.hidden){requestAnimationFrame(draw);return}
    x.clearRect(0,0,W,H);
    if(Math.random()<.006&&stars.length<2){var sx=Math.random()*W*.8;stars.push({x:sx,y:-10,vx:5+Math.random()*3,vy:3+Math.random()*2,l:1})}
    stars=stars.filter(function(t){t.x+=t.vx;t.y+=t.vy;t.l-=.012;if(t.l<=0)return false;
      var g=x.createLinearGradient(t.x,t.y,t.x-t.vx*9,t.y-t.vy*9);g.addColorStop(0,"rgba(190,210,255,"+t.l+")");g.addColorStop(1,"rgba(190,210,255,0)");
      x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(t.x,t.y);x.lineTo(t.x-t.vx*9,t.y-t.vy*9);x.stroke();x.lineWidth=1;return true});
    for(var a=0;a<P.length;a++){
      var p=P[a];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.fillStyle="rgba(140,165,255,.7)";x.beginPath();x.arc(p.x,p.y,1.5,0,6.283);x.fill();
      for(var b=a+1;b<P.length;b++){
        var q=P[b],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
        if(d<16000){x.strokeStyle="rgba(110,140,255,"+(.22*(1-d/16000))+")";x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}
      }
      var mx=p.x-mouse.x,my=p.y-mouse.y,md=mx*mx+my*my;
      if(md<22000){x.strokeStyle="rgba(166,107,255,"+(.5*(1-md/22000))+")";x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mouse.x,mouse.y);x.stroke()}
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
